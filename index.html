<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo AR</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <meta name="theme-color" content="#111827" />
    <!-- Classic scripts (not modules): MindAR expects AFRAME as a global. -->
    <script src="vendor/aframe.min.js"></script>
    <script src="vendor/mindar-image-aframe.prod.js"></script>
    <script src="vendor/aframe-extras.min.js"></script>
    <style>
      /* No background on body: it would paint over MindAR's camera video (z-index: -2). */
      html, body { margin: 0; height: 100%; overflow: hidden; }
      #tuning { position: fixed; top: 8px; left: 8px; z-index: 1000; padding: 4px 8px; border-radius: 4px;
                font: 12px/1.4 monospace; color: #fff; background: rgba(0, 0, 0, 0.6); pointer-events: none; }
      #cardboard-toggle { position: fixed; top: calc(12px + env(safe-area-inset-top)); right: 12px; z-index: 1000;
                          padding: 10px 18px; border: 0; border-radius: 999px; font: 600 15px/1 system-ui, sans-serif;
                          color: #fff; background: rgba(17, 24, 39, 0.85); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4); }
      /* Headset mode: the opaque stereo canvas covers everything. The camera video and the A-Frame canvas keep
         running underneath, untouched: hiding the video (e.g. opacity 0) may make Chrome stop updating it,
         and MindAR reads its frames. */
      #stereo { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 999; display: none; }
      body.cardboard #stereo { display: block; }
      /* Exit button, only in headset mode. Above #stereo so its tap does not toggle the narration. */
      #cardboard-exit { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: 10px; z-index: 1000;
                        display: none; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%;
                        background: rgba(17, 24, 39, 0.85); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4); }
      body.cardboard #cardboard-exit { display: block; }
      /* The X, drawn with CSS like the other icons. */
      #cardboard-exit::before, #cardboard-exit::after { content: ""; position: absolute; left: 50%; top: 50%;
                                                         width: 20px; height: 3px; border-radius: 2px; background: #fff; }
      #cardboard-exit::before { transform: translate(-50%, -50%) rotate(45deg); }
      #cardboard-exit::after { transform: translate(-50%, -50%) rotate(-45deg); }
      #cardboard-calibrate { position: fixed; top: calc(60px + env(safe-area-inset-top)); right: 12px; z-index: 1000;
                             padding: 6px 12px; border-radius: 999px; font: 500 13px/1 system-ui, sans-serif;
                             color: #fff; background: rgba(17, 24, 39, 0.7); text-decoration: none; }
      /* Link to the WebXR (ARCore) page, under "Calibrar gafas"; shown only where immersive-ar works. */
      #ar-mode { position: fixed; top: calc(100px + env(safe-area-inset-top)); right: 12px; z-index: 1000;
                 padding: 6px 12px; border-radius: 999px; font: 500 13px/1 system-ui, sans-serif;
                 color: #fff; background: rgba(17, 24, 39, 0.7); text-decoration: none; }
      #ar-mode[hidden] { display: none; }
      #snap-panel { position: fixed; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); z-index: 1000;
                    display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; gap: 6px 8px;
                    max-width: 420px; margin: 0 auto; padding: 10px 12px; border-radius: 12px; color: #fff;
                    background: rgba(17, 24, 39, 0.85); font: 500 15px/1.2 system-ui, sans-serif;
                    font-variant-numeric: tabular-nums; }
      #snap-panel output { min-width: 4.5em; text-align: right; font-weight: 700; }
      #snap-panel button { width: 44px; height: 40px; border: 0; border-radius: 10px; color: #fff;
                           background: #374151; font: 700 20px/1 system-ui, sans-serif; }
      #snap-panel .wide { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; }
      #snap-panel .wide button { width: auto; padding: 0 14px; font-size: 14px; }
      body.cardboard #snap-panel,
      body.cardboard #controls, body.cardboard #subtitles, body.cardboard #cardboard-toggle, body.cardboard #cardboard-calibrate, body.cardboard #ar-mode,
      body.cardboard .mindar-ui-overlay, body.cardboard #tuning { display: none !important; }
    </style>
    <link rel="stylesheet" href="narration.css" />
    <script src="cardboard-calibration.js"></script>
    <script src="narration.js"></script>
    <script src="pose-snap.js"></script>
    <script src="cardboard.js"></script>
    <script>
      // Tuning mode: no narration; the fox is always shown and #snap-panel tunes pose-snap on the phone.
      // Set to true to tune, false for the normal demo with narration.
      window.SNAP_TUNING = false;
    </script>
  </head>
  <body>
    <!--
      imageTargetSrc: compiled target (.mind): the marble floor from tools/generate-floor.py (print/floor-print.png).
      filterMinCF / filterBeta: MindAR's pose filter (defaults 0.001 / 1000). Turned off (minCF 1000 lets
      every reading through): pose-snap on the target smooths instead, without the lag of a heavy filter.
      All of them, the pose-snap values and the camera FOV can be overridden from the URL; see the script
      below the scene.
    -->
    <a-scene
      mindar-image="imageTargetSrc: targets/floor.mind; filterMinCF: 1000; filterBeta: 0; missTolerance: 5; warmupTolerance: 5"
      renderer="colorManagement: true"
      xr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <!-- Fox: Khronos glTF Sample Assets (CC0 model by PixelMannen, CC-BY 4.0 rig/animation by tomkranis). -->
        <a-asset-item id="animModel" src="models/fox/fox.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity light="type: ambient; intensity: 0.8"></a-entity>
      <a-entity light="type: directional; intensity: 0.6" position="0 1 1"></a-entity>

      <!--
        Units: target image width = 1. Tune the anchor transform to match the printed scenery.
        The image lies flat on the base, so rotate X 90 to stand the model up out of the image plane.
      -->
      <a-entity id="target" mindar-image-target="targetIndex: 0" pose-snap>
        <!-- Hidden until the narration starts (see the narration script). -->
        <a-entity id="anchor" position="0 0 0" rotation="90 0 0" scale="0.004 0.004 0.004" visible="false">
          <!-- Clips: Survey, Walk, Run. Y 90 makes the fox run sideways across the image. -->
          <a-gltf-model src="#animModel" rotation="0 90 0" animation-mixer="clip: Run; loop: repeat"></a-gltf-model>
        </a-entity>
      </a-entity>
    </a-scene>

    <!-- "El zorro y el erizo" (project's own narration). -->
    <audio id="narration" src="audio/zorro-y-erizo.mp3" preload="auto">
      <track kind="subtitles" src="audio/zorro-y-erizo.vtt" srclang="es" label="Español" default />
    </audio>
    <div id="subtitles" hidden><span></span></div>
    <div id="controls">
      <button id="play" type="button" data-icon="play" hidden>Reproducir narración</button>
      <button id="pause" type="button" data-icon="pause" hidden>Pausa</button>
      <button id="stop" type="button" data-icon="stop" hidden>Detener</button>
    </div>
    <button id="cardboard-toggle" type="button">Gafas</button>
    <a id="cardboard-calibrate" href="calibrate.html">Calibrar gafas</a>
    <a id="ar-mode" href="webxr-test.html" hidden>Modo AR</a>
    <canvas id="stereo"></canvas>
    <button id="cardboard-exit" type="button" aria-label="Salir del modo gafas"></button>

    <script>
      // MindAR builds its image processor for the camera frame size it gets at start and never updates it.
      // When the phone rotates (e.g. entering headset mode, which locks landscape) the frames change shape,
      // get squashed into the old size and the floor is no longer recognised. Restart MindAR whenever the
      // video size stops matching; camera permission is already granted, so there is no new prompt.
      (() => {
        const scene = document.querySelector('a-scene');
        let timer = null;
        // MindAR only emits targetFound when the target was hidden, and stop() does not hide it: without
        // this, after a restart the page would still think the floor is seen and no new targetFound would come.
        const markTargetsLost = window.markTargetsLost = () => {
          for (const el of document.querySelectorAll('[mindar-image-target]')) {
            if (!el.object3D.visible) continue;
            el.object3D.visible = false;
            el.emit('targetLost');
          }
        };
        const restartIfRotated = () => {
          const sys = scene.systems['mindar-image-system'];
          const { video, controller } = sys;
          if (!video || !controller || !video.videoWidth) return;
          if (video.videoWidth === controller.inputWidth && video.videoHeight === controller.inputHeight) return;
          markTargetsLost();
          sys.stop();
          sys.start();
        };
        scene.addEventListener('arReady', () => {
          // The video element is new after every (re)start. `resize` fires when its frame size changes;
          // wait a moment so the size settles after the rotation.
          scene.systems['mindar-image-system'].video.addEventListener('resize', () => {
            clearTimeout(timer);
            timer = setTimeout(restartIfRotated, 400);
          });
        });
      })();
    </script>

    <script>
      // Entering headset mode: fullscreen + landscape lock (both need a user gesture and may be refused;
      // the split view works without them), then the `cardboard` component on the scene.
      // Leaving fullscreen (back gesture or the X button) leaves the mode. ?cardboard turns it on without
      // fullscreen, for testing.
      (() => {
        const params = new URLSearchParams(location.search);
        const scene = document.querySelector('a-scene');
        const toggle = document.querySelector('#cardboard-toggle');
        if (params.has('debug')) {
          toggle.hidden = true;
          document.querySelector('#cardboard-calibrate').hidden = true;
          return;
        }
        // WebXR AR needs Chrome for Android with ARCore: not in the APK's WebView, iPhone or desktop.
        navigator.xr?.isSessionSupported('immersive-ar').then((ok) => {
          document.querySelector('#ar-mode').hidden = !ok;
        }, () => {});
        const enable = () => scene.setAttribute('cardboard', '');
        toggle.addEventListener('click', async () => {
          await window.CardboardCalibration.enterFullscreen();
          enable();
        });
        document.addEventListener('fullscreenchange', () => {
          if (!document.fullscreenElement) scene.removeAttribute('cardboard');
        });
        document.querySelector('#cardboard-exit').addEventListener('click', () => {
          screen.orientation?.unlock?.();
          // Leaving fullscreen fires fullscreenchange, which removes the mode; without fullscreen, remove it here.
          if (document.fullscreenElement) document.exitFullscreen();
          else scene.removeAttribute('cardboard');
        });
        if (params.has('cardboard')) {
          if (scene.hasLoaded) enable();
          else scene.addEventListener('loaded', enable);
        }
      })();
    </script>

    <script>
      // Narration (narration.js). Here the fox stays hidden until it starts and is hidden again by Stop;
      // the play button shows while the floor is detected.
      (() => {
        if (new URLSearchParams(location.search).has('debug') || window.SNAP_TUNING) return;
        const target = document.querySelector('#target');
        const anchor = document.querySelector('#anchor');
        const narration = window.createNarration({
          audio: document.querySelector('#narration'),
          playButton: document.querySelector('#play'),
          pauseButton: document.querySelector('#pause'),
          stopButton: document.querySelector('#stop'),
          subtitles: document.querySelector('#subtitles'),
          model: anchor.querySelector('a-gltf-model'),
          onStart: () => anchor.setAttribute('visible', true),
          onStop: () => anchor.setAttribute('visible', false),
        });
        target.addEventListener('targetFound', () => narration.setAvailable(true));
        target.addEventListener('targetLost', () => narration.setAvailable(false));
        // Used by the headset mode, where the on-screen buttons cannot be reached: it starts on its own.
        window.narration = narration;
      })();
    </script>

    <script>
      // Tuning from the URL, e.g. ?snap=0.08&smooth=0.5&fov=60&debug
      //   smooth, snap, snapdeg: pose-snap on the target (smoothing time in s, jump thresholds in target
      //          widths and degrees).
      //   mincf, beta: MindAR's pose filter, off by default (see a-scene comment).
      //   fov: vertical FOV in degrees MindAR assumes for the camera (library default 45; patched in
      //        vendor/mindar-image-aframe.prod.js to read window.MINDAR_FOVY). A wrong value makes
      //        anything standing out of the image plane lean and slide when the viewing angle changes.
      //   debug: replaces the model with a wireframe cube of side `cube` (image widths, default 0.2)
      //          standing on the image centre. Put a real box of the same size there and tune `fov`
      //          until both match from every angle.
      // Runs before MindAR initialises: A-Frame sets up scene components asynchronously.
      (() => {
        const params = new URLSearchParams(location.search);
        const scene = document.querySelector('a-scene');
        const shown = [];
        // The component is not initialised yet, so A-Frame's getAttribute() returns undefined:
        // read and parse the raw HTML attribute instead.
        const raw = HTMLElement.prototype.getAttribute.call(scene, 'mindar-image');
        const mindar = AFRAME.utils.styleParser.parse(raw);
        const filter = { mincf: 'filterMinCF', beta: 'filterBeta' };
        for (const [param, prop] of Object.entries(filter)) {
          const value = parseFloat(params.get(param));
          if (!Number.isNaN(value)) mindar[prop] = value;
          shown.push(`${param}=${mindar[prop]}`);
        }
        scene.setAttribute('mindar-image', mindar);
        const snap = { smooth: 'smooth', snap: 'snap', snapdeg: 'snapDeg' };
        const target = document.querySelector('#target');
        for (const [param, prop] of Object.entries(snap)) {
          const value = parseFloat(params.get(param));
          if (!Number.isNaN(value)) target.setAttribute('pose-snap', prop, value);
          if (params.has(param)) shown.push(`${param}=${value}`);
        }
        const fov = parseFloat(params.get('fov'));
        if (!Number.isNaN(fov)) window.MINDAR_FOVY = fov;
        shown.push(`fov=${window.MINDAR_FOVY || 45}`);

        if (params.has('debug')) {
          const size = parseFloat(params.get('cube')) || 0.2;
          document.querySelector('#anchor').setAttribute('visible', false);
          const cube = document.createElement('a-box');
          cube.setAttribute('width', size);
          cube.setAttribute('height', size);
          cube.setAttribute('depth', size);
          cube.setAttribute('position', `0 0 ${size / 2}`);
          cube.setAttribute('material', 'color: #38bdf8; wireframe: true; shader: flat');
          document.querySelector('[mindar-image-target]').appendChild(cube);
          shown.push(`cube=${size}`);
        }

        if (['mincf', 'beta', 'fov', 'debug', 'cube', 'smooth', 'snap', 'snapdeg'].some((k) => params.has(k))) {
          const label = document.createElement('div');
          label.id = 'tuning';
          label.textContent = shown.join('  ');
          document.body.appendChild(label);
        }
      })();
    </script>

    <script>
      // pose-snap tuning panel (window.SNAP_TUNING): - / + per value, saved on the phone (localStorage) so
      // it survives reloads. Values given in the URL win over the saved ones. "Saltos" counts jumps per
      // second: with the phone still it should stay at 0; if not, the thresholds are below the noise.
      (() => {
        if (!window.SNAP_TUNING) return;
        const params = new URLSearchParams(location.search);
        const target = document.querySelector('#target');
        const anchor = document.querySelector('#anchor');
        const KEY = 'pose-snap';
        const DEFAULTS = { smooth: 0.5, snap: 0.01, snapDeg: 6 };
        const ROWS = [
          { prop: 'smooth', param: 'smooth', label: 'Suavizado', step: 0.1, min: 0, max: 3, show: (v) => `${v.toFixed(1)} s` },
          // Target widths; on the 1 m print, 0.01 = 1 cm.
          { prop: 'snap', param: 'snap', label: 'Salto (distancia)', step: 0.01, min: 0.01, max: 0.3, show: (v) => `${(v * 100).toFixed(0)} cm` },
          { prop: 'snapDeg', param: 'snapdeg', label: 'Salto (giro)', step: 1, min: 1, max: 30, show: (v) => `${v.toFixed(0)}°` },
        ];
        let saved = {};
        try { saved = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { /* private mode */ }
        const values = { ...DEFAULTS, ...saved };
        for (const r of ROWS) {
          const v = parseFloat(params.get(r.param));
          if (!Number.isNaN(v)) values[r.prop] = v;
        }

        const panel = document.createElement('div');
        panel.id = 'snap-panel';
        const outputs = {};
        for (const r of ROWS) {
          const label = document.createElement('span');
          label.textContent = r.label;
          const out = outputs[r.prop] = document.createElement('output');
          const minus = document.createElement('button');
          const plus = document.createElement('button');
          minus.type = plus.type = 'button';
          minus.textContent = '−';
          plus.textContent = '+';
          minus.addEventListener('click', () => change(r, -1));
          plus.addEventListener('click', () => change(r, 1));
          panel.append(label, out, minus, plus);
        }
        const footer = document.createElement('div');
        footer.className = 'wide';
        const rate = document.createElement('span');
        const reset = document.createElement('button');
        reset.type = 'button';
        reset.textContent = 'Restablecer';
        reset.addEventListener('click', () => {
          Object.assign(values, DEFAULTS);
          apply();
        });
        footer.append(rate, reset);
        panel.append(footer);
        document.body.append(panel);

        function change(r, dir) {
          const v = Math.round((values[r.prop] + dir * r.step) / r.step) * r.step;
          values[r.prop] = Math.min(r.max, Math.max(r.min, v));
          apply();
        }
        function apply() {
          for (const r of ROWS) outputs[r.prop].textContent = r.show(values[r.prop]);
          target.setAttribute('pose-snap', values);
          try { localStorage.setItem(KEY, JSON.stringify(values)); } catch (e) { /* private mode */ }
        }
        apply();

        anchor.setAttribute('visible', true);
        anchor.querySelector('a-gltf-model').setAttribute('animation-mixer', 'clip', 'Survey');
        let last = 0;
        setInterval(() => {
          const comp = target.components['pose-snap'];
          const snaps = comp ? comp.snaps || 0 : 0;
          rate.textContent = target.object3D.visible ? `Saltos: ${snaps - last}/s` : 'Apunta al suelo';
          last = snaps;
        }, 1000);
      })();
    </script>
  </body>
</html>
