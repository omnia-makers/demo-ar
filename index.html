<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo AR</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <meta name="theme-color" content="#111827" />
    <!-- Classic scripts (not modules): MindAR expects AFRAME as a global. -->
    <script src="vendor/aframe.min.js"></script>
    <script src="vendor/mindar-image-aframe.prod.js"></script>
    <script src="vendor/aframe-extras.min.js"></script>
    <style>
      /* No background on body: it would paint over MindAR's camera video (z-index: -2). */
      html, body { margin: 0; height: 100%; overflow: hidden; }
      #tuning { position: fixed; top: 8px; left: 8px; z-index: 1000; padding: 4px 8px; border-radius: 4px;
                font: 12px/1.4 monospace; color: #fff; background: rgba(0, 0, 0, 0.6); pointer-events: none; }
      #controls { position: fixed; left: 50%; bottom: calc(32px + env(safe-area-inset-bottom)); z-index: 1000;
                  transform: translateX(-50%); display: flex; gap: 12px; }
      #controls button { padding: 14px 24px; border: 0; border-radius: 999px; white-space: nowrap;
                         font: 600 17px/1 system-ui, sans-serif; color: #fff; background: rgba(17, 24, 39, 0.85);
                         box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4); }
      #controls button[hidden] { display: none; }
      /* Icons drawn with CSS: glyphs like U+25B6 render as colour emoji on some phones. */
      #controls button::before { content: ""; display: inline-block; width: 0.75em; height: 0.75em;
                                 margin-right: 0.5em; vertical-align: -0.05em; background: currentColor; }
      #controls button[data-icon="play"]::before { clip-path: polygon(10% 0, 100% 50%, 10% 100%); }
      #controls button[data-icon="pause"]::before {
        background: linear-gradient(90deg, currentColor 0 35%, transparent 35% 65%, currentColor 65%); }
      #controls button[data-icon="stop"]::before { clip-path: inset(6%); }
      #controls button[data-icon="replay"]::before { border: 0.14em solid currentColor; border-right-color: transparent;
                                                     border-radius: 50%; background: none; box-sizing: border-box; }
      #subtitles { position: fixed; left: 50%; bottom: calc(104px + env(safe-area-inset-bottom)); z-index: 1000;
                   transform: translateX(-50%); width: max-content; max-width: 90vw; text-align: center;
                   white-space: pre-line; pointer-events: none; }
      #subtitles[hidden] { display: none; }
      /* Black box per line (clone repeats the padding on wrapped lines). */
      #subtitles span { padding: 4px 10px; font: 500 18px/1.7 system-ui, sans-serif;
                        color: #fff; background: #000; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
      #cardboard-toggle { position: fixed; top: calc(12px + env(safe-area-inset-top)); right: 12px; z-index: 1000;
                          padding: 10px 18px; border: 0; border-radius: 999px; font: 600 15px/1 system-ui, sans-serif;
                          color: #fff; background: rgba(17, 24, 39, 0.85); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4); }
      /* Headset mode: the opaque stereo canvas covers everything. The camera video and the A-Frame canvas keep
         running underneath, untouched: hiding the video (e.g. opacity 0) may make Chrome stop updating it,
         and MindAR reads its frames. */
      #stereo { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 999; display: none; }
      body.cardboard #stereo { display: block; }
      /* Exit button, only in headset mode. Above #stereo so its tap does not toggle the narration. */
      #cardboard-exit { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: 10px; z-index: 1000;
                        display: none; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%;
                        background: rgba(17, 24, 39, 0.85); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4); }
      body.cardboard #cardboard-exit { display: block; }
      /* The X, drawn with CSS like the other icons. */
      #cardboard-exit::before, #cardboard-exit::after { content: ""; position: absolute; left: 50%; top: 50%;
                                                         width: 20px; height: 3px; border-radius: 2px; background: #fff; }
      #cardboard-exit::before { transform: translate(-50%, -50%) rotate(45deg); }
      #cardboard-exit::after { transform: translate(-50%, -50%) rotate(-45deg); }
      #cardboard-calibrate { position: fixed; top: calc(60px + env(safe-area-inset-top)); right: 12px; z-index: 1000;
                             padding: 6px 12px; border-radius: 999px; font: 500 13px/1 system-ui, sans-serif;
                             color: #fff; background: rgba(17, 24, 39, 0.7); text-decoration: none; }
      body.cardboard #controls, body.cardboard #subtitles, body.cardboard #cardboard-toggle, body.cardboard #cardboard-calibrate,
      body.cardboard .mindar-ui-overlay, body.cardboard #tuning { display: none !important; }
    </style>
    <script src="cardboard-calibration.js"></script>
    <script>
      // Headset (Cardboard-style) mode: after A-Frame renders each frame (tock), copy what the phone would
      // show into #stereo twice, side by side, so both eyes see the same image (no depth). Each copy is
      // centred on its lens with the values from calibrate.html (CardboardCalibration): if the two images
      // are not centred on the lenses the eyes cannot fuse them and everything is seen twice. Subtitles and
      // hints are drawn per eye, around the same centre, because the DOM overlays cannot be duplicated.
      // There are no touch controls in this mode (only the X to leave): once the floor is detected a
      // countdown gives time to put the phone in the viewer, then the narration starts by itself.
      const CARDBOARD_COUNTDOWN_MS = 10000;
      AFRAME.registerComponent('cardboard', {
        init() {
          this.countdownEnd = null;
          this.started = false;
          // Only if the browser refused to start the audio on its own: then a tap is needed once.
          this.blocked = false;
          this.onTap = () => { if (this.blocked) this.startNarration(); };
          document.querySelector('#stereo').addEventListener('pointerup', this.onTap);
          // The countdown waits for a detection made in this mode: forget the current one (if MindAR is
          // still tracking, it reports the floor again on the next frame) and drop a countdown started just
          // before MindAR restarts for the rotation to landscape.
          this.target = document.querySelector('#target');
          this.onFound = () => {
            if (!this.started && !this.blocked && this.countdownEnd === null) {
              this.countdownEnd = performance.now() + CARDBOARD_COUNTDOWN_MS;
            }
          };
          this.onRestarted = () => { if (!this.started) this.countdownEnd = null; };
          this.target.addEventListener('targetFound', this.onFound);
          this.el.addEventListener('arReady', this.onRestarted);
          window.markTargetsLost?.();
          this.out = document.querySelector('#stereo');
          this.ctx = this.out.getContext('2d');
          this.subtitle = document.querySelector('#subtitles');
          this.calibration = window.CardboardCalibration.load();
          this.onResize = () => {
            this.dpr = Math.min(window.devicePixelRatio || 1, 1.5);
            this.out.width = Math.round(window.innerWidth * this.dpr);
            this.out.height = Math.round(window.innerHeight * this.dpr);
          };
          this.onResize();
          window.addEventListener('resize', this.onResize);
          document.body.classList.add('cardboard');
        },
        remove() {
          document.querySelector('#stereo').removeEventListener('pointerup', this.onTap);
          this.target.removeEventListener('targetFound', this.onFound);
          this.el.removeEventListener('arReady', this.onRestarted);
          window.removeEventListener('resize', this.onResize);
          document.body.classList.remove('cardboard');
        },
        tock() {
          const { ctx, dpr } = this;
          const W = window.innerWidth, H = window.innerHeight;
          const video = this.el.systems['mindar-image-system'].video;
          const c = window.CardboardCalibration.resolve(W, H, this.calibration);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.fillStyle = '#000';
          ctx.fillRect(0, 0, W, H);
          this.updateCountdown();
          const overlays = this.overlays();
          for (const { cx, cy, clipX, clipW } of window.CardboardCalibration.eyes(W, H, c)) {
            ctx.save();
            ctx.beginPath();
            ctx.rect(clipX, 0, clipW, H);
            ctx.clip();
            ctx.save();
            // The centre of the normal full-screen view goes to the lens centre, scaled by the zoom.
            ctx.translate(cx, cy);
            ctx.scale(c.zoom, c.zoom);
            ctx.translate(-W / 2, -H / 2);
            // MindAR sizes the video to cover the screen and offsets it with inline styles.
            if (video && video.readyState >= 2) {
              const s = video.style;
              ctx.drawImage(video, parseFloat(s.left) || 0, parseFloat(s.top) || 0,
                            parseFloat(s.width) || W, parseFloat(s.height) || H);
            }
            ctx.drawImage(this.el.canvas, 0, 0, W, H);
            ctx.restore();
            for (const text of overlays) this.drawText(text, cx, cy, H, c.zoom);
            ctx.restore();
          }
          ctx.fillStyle = '#000';
          ctx.fillRect(W / 2 - 1, 0, 2, H);
        },
        // The countdown is started by onFound; it keeps running if the floor is lost while the phone goes
        // into the viewer, and starts the narration when it ends. Once per visit to the mode.
        updateCountdown() {
          const n = window.narration;
          if (!n || this.started || this.blocked) return;
          if (n.state === 'playing' || n.state === 'paused') {
            this.started = true;
            return;
          }
          if (this.countdownEnd !== null && performance.now() >= this.countdownEnd) this.startNarration();
        },
        startNarration() {
          this.started = true;
          this.blocked = false;
          this.countdownEnd = null;
          window.narration.start().catch(() => { this.blocked = true; });
        },
        // Texts drawn in each eye: the current subtitle plus a status hint. dy = offset from the lens
        // centre as a fraction of the screen height.
        overlays() {
          const out = [];
          if (!this.subtitle.hidden) out.push({ lines: this.subtitle.textContent.split('\n'), dy: 0.22 });
          const n = window.narration;
          if (!n) return out;
          if (this.blocked) out.push({ lines: ['Toca la pantalla para empezar'], dy: 0 });
          else if (n.state === 'paused') out.push({ lines: ['En pausa'], dy: -0.28 });
          else if (this.countdownEnd !== null) {
            const secs = Math.max(1, Math.ceil((this.countdownEnd - performance.now()) / 1000));
            out.push({ lines: ['Coloca el móvil en las gafas', `Empieza en ${secs}`], dy: 0.2 });
          } else if (n.state === 'ended' && this.started) out.push({ lines: ['Fin'], dy: 0 });
          else if (!n.floorVisible && n.state !== 'playing') out.push({ lines: ['Apunta al suelo'], dy: 0 });
          return out;
        },
        drawText({ lines, dy }, cx, cy, H, zoom) {
          const { ctx } = this;
          const size = Math.max(12, Math.round(H * 0.04 * zoom));
          const lineH = size * 1.5;
          ctx.font = `500 ${size}px system-ui, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          lines.forEach((line, i) => {
            const raw = cy + H * dy * zoom + (i - (lines.length - 1) / 2) * lineH;
            const ly = Math.min(H - lineH / 2, Math.max(lineH / 2, raw));
            const w = ctx.measureText(line).width + size;
            ctx.fillStyle = '#000';
            ctx.fillRect(cx - w / 2, ly - lineH / 2, w, lineH);
            ctx.fillStyle = '#fff';
            ctx.fillText(line, cx, ly);
          });
        },
      });
    </script>
  </head>
  <body>
    <!--
      imageTargetSrc: compiled target (.mind): the marble floor from tools/generate-floor.py (print/floor-print.png).
      filterMinCF / filterBeta: jitter vs. lag trade-off of the pose filter (MindAR defaults: 0.001 / 1000).
      Lower minCF = less jitter when still; higher beta = less lag (sliding) when moving.
      0.0001 / 0.001 chosen after testing on the phone: heavy smoothing looked best for this demo.
      All of them, plus the camera FOV, can be overridden from the URL; see the script below the scene.
    -->
    <a-scene
      mindar-image="imageTargetSrc: targets/floor.mind; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 5; warmupTolerance: 5"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      xr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <!-- Fox: Khronos glTF Sample Assets (CC0 model by PixelMannen, CC-BY 4.0 rig/animation by tomkranis). -->
        <a-asset-item id="animModel" src="models/fox/fox.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity light="type: ambient; intensity: 0.8"></a-entity>
      <a-entity light="type: directional; intensity: 0.6" position="0 1 1"></a-entity>

      <!--
        Units: target image width = 1. Tune the anchor transform to match the printed scenery.
        The image lies flat on the base, so rotate X 90 to stand the model up out of the image plane.
      -->
      <a-entity id="target" mindar-image-target="targetIndex: 0">
        <!-- Hidden until the narration starts (see the narration script). -->
        <a-entity id="anchor" position="0 0 0" rotation="90 0 0" scale="0.004 0.004 0.004" visible="false">
          <!-- Clips: Survey, Walk, Run. Y 90 makes the fox run sideways across the image. -->
          <a-gltf-model src="#animModel" rotation="0 90 0" animation-mixer="clip: Run; loop: repeat"></a-gltf-model>
        </a-entity>
      </a-entity>
    </a-scene>

    <!-- "La zorra y las uvas", Las Fábulas de Esopo vol. 1, read by paulino for LibriVox (public domain). -->
    <audio id="narration" src="audio/zorra-y-uvas.mp3" preload="auto">
      <track kind="subtitles" src="audio/zorra-y-uvas.vtt" srclang="es" label="Español" default />
    </audio>
    <div id="subtitles" hidden><span></span></div>
    <div id="controls">
      <button id="play" type="button" data-icon="play" hidden>Reproducir narración</button>
      <button id="pause" type="button" data-icon="pause" hidden>Pausa</button>
      <button id="stop" type="button" data-icon="stop" hidden>Detener</button>
    </div>
    <button id="cardboard-toggle" type="button">Gafas</button>
    <a id="cardboard-calibrate" href="calibrate.html">Calibrar gafas</a>
    <canvas id="stereo"></canvas>
    <button id="cardboard-exit" type="button" aria-label="Salir del modo gafas"></button>

    <script>
      // MindAR builds its image processor for the camera frame size it gets at start and never updates it.
      // When the phone rotates (e.g. entering headset mode, which locks landscape) the frames change shape,
      // get squashed into the old size and the floor is no longer recognised. Restart MindAR whenever the
      // video size stops matching; camera permission is already granted, so there is no new prompt.
      (() => {
        const scene = document.querySelector('a-scene');
        let timer = null;
        // MindAR only emits targetFound when the target was hidden, and stop() does not hide it: without
        // this, after a restart the page would still think the floor is seen and no new targetFound would come.
        const markTargetsLost = window.markTargetsLost = () => {
          for (const el of document.querySelectorAll('[mindar-image-target]')) {
            if (!el.object3D.visible) continue;
            el.object3D.visible = false;
            el.emit('targetLost');
          }
        };
        const restartIfRotated = () => {
          const sys = scene.systems['mindar-image-system'];
          const { video, controller } = sys;
          if (!video || !controller || !video.videoWidth) return;
          if (video.videoWidth === controller.inputWidth && video.videoHeight === controller.inputHeight) return;
          markTargetsLost();
          sys.stop();
          sys.start();
        };
        scene.addEventListener('arReady', () => {
          // The video element is new after every (re)start. `resize` fires when its frame size changes;
          // wait a moment so the size settles after the rotation.
          scene.systems['mindar-image-system'].video.addEventListener('resize', () => {
            clearTimeout(timer);
            timer = setTimeout(restartIfRotated, 400);
          });
        });
      })();
    </script>

    <script>
      // Entering headset mode: fullscreen + landscape lock (both need a user gesture and may be refused;
      // the split view works without them), then the `cardboard` component on the scene.
      // Leaving fullscreen (back gesture or the X button) leaves the mode. ?cardboard turns it on without
      // fullscreen, for testing.
      (() => {
        const params = new URLSearchParams(location.search);
        const scene = document.querySelector('a-scene');
        const toggle = document.querySelector('#cardboard-toggle');
        if (params.has('debug')) {
          toggle.hidden = true;
          document.querySelector('#cardboard-calibrate').hidden = true;
          return;
        }
        const enable = () => scene.setAttribute('cardboard', '');
        toggle.addEventListener('click', async () => {
          try {
            await document.documentElement.requestFullscreen();
            await screen.orientation.lock('landscape');
          } catch (e) {
            // Not supported (e.g. desktop): keep going with the split view.
          }
          enable();
        });
        document.addEventListener('fullscreenchange', () => {
          if (!document.fullscreenElement) scene.removeAttribute('cardboard');
        });
        document.querySelector('#cardboard-exit').addEventListener('click', () => {
          screen.orientation?.unlock?.();
          // Leaving fullscreen fires fullscreenchange, which removes the mode; without fullscreen, remove it here.
          if (document.fullscreenElement) document.exitFullscreen();
          else scene.removeAttribute('cardboard');
        });
        if (params.has('cardboard')) {
          if (scene.hasLoaded) enable();
          else scene.addEventListener('loaded', enable);
        }
      })();
    </script>

    <script>
      // Narration. States: idle (nothing started), playing, paused, ended.
      // - idle/ended: "Reproducir"/"Repetir" shows while the floor is detected. Pressing it (a user gesture,
      //   which mobile browsers require to play audio) shows the fox running and plays the narration.
      // - playing/paused: Pause/Continue and Stop show even if the floor is lost, since the audio keeps going.
      //   Pause also freezes the fox; Stop rewinds and hides it, back to idle.
      // - ended: the fox idles (Survey) and the start button offers a replay.
      // Subtitles come from the <track> (WebVTT); the browser picks the active cue from the audio time and
      // we draw it ourselves (track mode "hidden") so it looks the same everywhere.
      (() => {
        if (new URLSearchParams(location.search).has('debug')) return;
        const target = document.querySelector('#target');
        const anchor = document.querySelector('#anchor');
        const model = anchor.querySelector('a-gltf-model');
        const audio = document.querySelector('#narration');
        const playButton = document.querySelector('#play');
        const pauseButton = document.querySelector('#pause');
        const stopButton = document.querySelector('#stop');
        const subtitles = document.querySelector('#subtitles');
        const track = audio.querySelector('track').track;
        let visible = false;
        let state = 'idle';

        const showSubtitle = () => {
          const cue = track.activeCues?.[0];
          const active = state === 'playing' || state === 'paused';
          subtitles.hidden = !(cue && active);
          subtitles.firstElementChild.textContent = cue ? cue.text : '';
        };
        track.mode = 'hidden';
        track.addEventListener('cuechange', showSubtitle);

        const setState = (next) => {
          state = next;
          showSubtitle();
          const active = state === 'playing' || state === 'paused';
          playButton.hidden = active || !visible;
          playButton.dataset.icon = state === 'ended' ? 'replay' : 'play';
          playButton.textContent = state === 'ended' ? 'Repetir narración' : 'Reproducir narración';
          pauseButton.hidden = stopButton.hidden = !active;
          pauseButton.dataset.icon = state === 'paused' ? 'play' : 'pause';
          pauseButton.textContent = state === 'paused' ? 'Continuar' : 'Pausa';
          model.setAttribute('animation-mixer', 'timeScale', state === 'paused' ? 0 : 1);
        };
        target.addEventListener('targetFound', () => { visible = true; setState(state); });
        target.addEventListener('targetLost', () => { visible = false; setState(state); });

        // Returns play()'s promise: without a recent user gesture on this page the browser may refuse to
        // play, which can happen when the headset mode starts it on its own.
        const start = () => {
          anchor.setAttribute('visible', true);
          model.setAttribute('animation-mixer', 'clip', 'Run');
          audio.currentTime = 0;
          setState('playing');
          return audio.play().catch((e) => {
            anchor.setAttribute('visible', false);
            setState('idle');
            throw e;
          });
        };
        const pauseOrResume = () => {
          if (state === 'paused') {
            audio.play();
            setState('playing');
          } else {
            audio.pause();
            setState('paused');
          }
        };
        playButton.addEventListener('click', start);
        pauseButton.addEventListener('click', pauseOrResume);
        stopButton.addEventListener('click', () => {
          audio.pause();
          audio.currentTime = 0;
          anchor.setAttribute('visible', false);
          setState('idle');
        });
        audio.addEventListener('ended', () => {
          model.setAttribute('animation-mixer', 'clip', 'Survey');
          setState('ended');
        });

        // Used by the headset mode, where the on-screen buttons cannot be reached: it starts on its own.
        window.narration = {
          start,
          get state() { return state; },
          get floorVisible() { return visible; },
        };
      })();
    </script>

    <script>
      // Tuning from the URL, e.g. ?beta=10&mincf=0.001&fov=60&debug
      //   mincf, beta: pose filter (see a-scene comment).
      //   fov: vertical FOV in degrees MindAR assumes for the camera (library default 45; patched in
      //        vendor/mindar-image-aframe.prod.js to read window.MINDAR_FOVY). A wrong value makes
      //        anything standing out of the image plane lean and slide when the viewing angle changes.
      //   debug: replaces the model with a wireframe cube of side `cube` (image widths, default 0.2)
      //          standing on the image centre. Put a real box of the same size there and tune `fov`
      //          until both match from every angle.
      // Runs before MindAR initialises: A-Frame sets up scene components asynchronously.
      (() => {
        const params = new URLSearchParams(location.search);
        const scene = document.querySelector('a-scene');
        const shown = [];
        // The component is not initialised yet, so A-Frame's getAttribute() returns undefined:
        // read and parse the raw HTML attribute instead.
        const raw = HTMLElement.prototype.getAttribute.call(scene, 'mindar-image');
        const mindar = AFRAME.utils.styleParser.parse(raw);
        const filter = { mincf: 'filterMinCF', beta: 'filterBeta' };
        for (const [param, prop] of Object.entries(filter)) {
          const value = parseFloat(params.get(param));
          if (!Number.isNaN(value)) mindar[prop] = value;
          shown.push(`${param}=${mindar[prop]}`);
        }
        scene.setAttribute('mindar-image', mindar);
        const fov = parseFloat(params.get('fov'));
        if (!Number.isNaN(fov)) window.MINDAR_FOVY = fov;
        shown.push(`fov=${window.MINDAR_FOVY || 45}`);

        if (params.has('debug')) {
          const size = parseFloat(params.get('cube')) || 0.2;
          document.querySelector('#anchor').setAttribute('visible', false);
          const cube = document.createElement('a-box');
          cube.setAttribute('width', size);
          cube.setAttribute('height', size);
          cube.setAttribute('depth', size);
          cube.setAttribute('position', `0 0 ${size / 2}`);
          cube.setAttribute('material', 'color: #38bdf8; wireframe: true; shader: flat');
          document.querySelector('[mindar-image-target]').appendChild(cube);
          shown.push(`cube=${size}`);
        }

        if (['mincf', 'beta', 'fov', 'debug', 'cube'].some((k) => params.has(k))) {
          const label = document.createElement('div');
          label.id = 'tuning';
          label.textContent = shown.join('  ');
          document.body.appendChild(label);
        }
      })();
    </script>
  </body>
</html>
